<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="bananaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Outer rounded background -->
  <rect width="100" height="100" rx="28" fill="url(#bgGrad)" />

  <!-- Inner dark card -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#0f0728" />

  <!-- Banana Body -->
  <path d="M 28 72 C 22 50 32 25 56 20 C 62 18 68 20 70 24 C 62 26 50 34 46 48 C 42 62 52 72 68 76 C 52 82 34 82 28 72 Z" fill="url(#bananaGrad)" />

  <!-- Cool Sunglasses -->
  <polygon points="38,36 54,36 51,44 41,44" fill="#000" stroke="#facc15" stroke-width="1.5" />
  <polygon points="56,36 70,36 67,44 58,44" fill="#000" stroke="#facc15" stroke-width="1.5" />
  <line x1="54" y1="38" x2="56" y2="38" stroke="#facc15" stroke-width="2" />

  <!-- Smile -->
  <path d="M 44 52 Q 54 62 64 52" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" />

  <!-- Gold Chain Dollar Sign -->
  <circle cx="54" cy="68" r="6" fill="#facc15" stroke="#78350f" stroke-width="1" />
  <text x="54" y="71" font-size="8" font-weight="900" font-family="sans-serif" text-anchor="middle" fill="#000">$</text>
</svg>
